{% extends 'departamentos/base.html' %}
{% block title %}Ingresar{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-header card-header-verde text-center py-3">
        <h4 class="mb-0">SISTEMA AUTOMATIZADO DE COBRANZAS</h4>
      </div>
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
