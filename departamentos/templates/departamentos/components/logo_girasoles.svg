<svg class="rm-logo-svg" viewBox="0 0 400 108" width="400" height="108"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Torre D · Condominio Los Girasoles">
  {# Logo Torre D hecho a mano. Sin ids: el recibo puede repetirse en la página. #}

  <!-- Línea verde de abajo, de lado a lado -->
  <rect x="0" y="104" width="400" height="4" fill="#2e8b35"/>

  <!-- Tallo -->
  <path d="M 85 60 Q 80 84 86 104" fill="none" stroke="#2e8b35" stroke-width="5" stroke-linecap="round"/>
  <!-- Hoja y su nervio -->
  <path d="M 84 92 Q 100 72 122 80 Q 106 98 84 92 Z" fill="#fff" stroke="#2e8b35" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 84 92 Q 102 86 122 80" fill="none" stroke="#2e8b35" stroke-width="1.5"/>

  <!-- Techo y ventanita -->
  <polyline points="120,42 182,7 240,38" fill="none" stroke="#2e8b35"
            stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2e8b35">
    <rect x="148" y="33" width="8" height="8"/>
    <rect x="157" y="33" width="8" height="8"/>
    <rect x="148" y="42" width="8" height="8"/>
    <rect x="157" y="42" width="8" height="8"/>
  </g>

  <!-- Pétalos de atrás -->
  <g fill="#e9a614">
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(15 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(45 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(75 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(105 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(135 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(165 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(195 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(225 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(255 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(285 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(315 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(345 85 46)"/>
  </g>
  <!-- Pétalos de adelante -->
  <g fill="#f9c80e" stroke="#e0a00c" stroke-width="1">
    <ellipse cx="85" cy="20" rx="8" ry="15"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(30 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(60 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(90 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(120 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(150 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(180 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(210 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(240 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(270 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(300 85 46)"/>
    <ellipse cx="85" cy="20" rx="8" ry="15" transform="rotate(330 85 46)"/>
  </g>
  <!-- Centro del girasol -->
  <circle cx="85" cy="46" r="15" fill="#6b3e1e"/>
  <circle cx="85" cy="46" r="10" fill="#4a2a12"/>

  <!-- Pastilla TORRE D -->
  <rect x="205" y="3" width="190" height="30" rx="12" fill="#1f6a2b"/>
  <text x="300" y="27" text-anchor="middle" fill="#fff"
        style="font: 800 26px 'Roboto Condensed', Arial, sans-serif; letter-spacing: 3px;">TORRE D</text>

  <!-- Textos -->
  <text x="286" y="56" text-anchor="middle" fill="#1f6a2b"
        style="font: 800 17px 'Roboto Condensed', Arial, sans-serif; letter-spacing: 1.5px;">CONDOMINIO</text>
  <text x="176" y="95" fill="#1f6a2b" textLength="219" lengthAdjust="spacingAndGlyphs"
        style="font: 800 44px 'Roboto Condensed', Arial, sans-serif;">Los Girasoles</text>
</svg>