{# PageHeader · uso: {% include 'departamentos/components/page_header.html' with title="Deudores" subtitle="..." action_label="Nuevo" action_url=url %} #}
<div class="page-header">
  <div>
    <h1 class="page-header__title">{{ title }}</h1>
    {% if subtitle %}<p class="page-header__subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_label %}
  <div class="d-flex gap-2">
    <a href="{{ action_url }}" class="btn btn-success">{{ action_label }}</a>
  </div>
  {% endif %}
</div>
